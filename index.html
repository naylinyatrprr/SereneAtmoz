<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Status Board</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            padding: 20px;
        }

        #room-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        /* โครงสร้างการ์ด */
        .room-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #e0e0e0;
        }

        /* แถบ Badge */
        .badge {
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
        }

        /* แถบสีแดง - Ready to move ( Highlight ) */
        .badge-red {
            background-color: #e53935;
        }

        /* แถบสีเทา - Remark Alert ( Remark ) */
        .badge-gray {
            background-color: #757575;
        }

        .card-body {
            padding: 15px;
        }

        .card-body h3 {
            margin-bottom: 8px;
            color: #333;
        }

        .card-body p {
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div id="room-container">
        <!-- การ์ดห้องพักจะถูกสร้างและแสดงผลผ่าน JavaScript ตรงนี้ -->
    </div>

    <script>
        // 1. ใส่ URL ของ CSV ของคุณตรงนี้
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTdclldmnW01ORgCmT0q3EIc6qDpx2vw1WJjYEKwImYcBq-td2P_WRjRqspjs2IxjJl6BPj2K-KDSlQ/pub?output=csv';

        async function loadRoomData() {
            try {
                // เติม ?t=${new Date().getTime()} เพื่อป้องกันการติด Browser Cache ทำให้ดึงข้อมูลเรียลไทม์สดๆ เสมอ
                const response = await fetch(`${CSV_URL}?t=${new Date().getTime()}`);
                const csvText = await response.text();
                
                // แปลง CSV เป็น Object
                const rooms = parseCSV(csvText); 
                
                // แสดงผลการ์ด
                renderRoomCards(rooms);
            } catch (error) {
                console.error("Error fetching CSV data:", error);
            }
        }

        function renderRoomCards(rooms) {
            const container = document.getElementById('room-container');
            container.innerHTML = ''; // ล้างข้อมูลเก่าก่อนแสดงผลใหม่

            rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = 'room-card';

                // --- LOGIC เดิมของคุณ ---
                
                // 1. เช็กคอลัมน์ highlight -> แถบสีแดง Ready to move
                let highlightBadge = '';
                if (room.highlight && room.highlight.trim() !== '') {
                    highlightBadge = `<div class="badge badge-red">Ready to move: ${room.highlight}</div>`;
                }

                // 2. เช็กคอลัมน์ remark -> แถบสีเทา Remark Alert
                let remarkBadge = '';
                if (room.remark && room.remark.trim() !== '') {
                    remarkBadge = `<div class="badge badge-gray">Remark Alert: ${room.remark}</div>`;
                }

                // ประกอบ HTML ของการ์ดห้องพัก
                card.innerHTML = `
                    ${highlightBadge}
                    ${remarkBadge}
                    <div class="card-body">
                        <h3>ห้อง ${room.room_number || room.room || 'N/A'}</h3>
                        <p>สถานะ: ${room.status || '-'}</p>
                        <p>ราคา: ${room.price || '-'}</p>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // ฟังก์ชันช่วยแปลงข้อความ CSV เป็น JavaScript Array of Objects
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if (lines.length === 0) return [];

            // หัวคอลัมน์ (แปลงเป็นตัวพิมพ์เล็กเพื่อกันปัญหาเรื่องตัวพิมพ์เล็ก/ใหญ่)
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/^"|"$/g, ''));
            
            return lines.slice(1).map(line => {
                const values = line.split(',').map(v => v.trim().replace(/^"|"$/g, ''));
                let obj = {};
                headers.forEach((header, index) => {
                    obj[header] = values[index] || '';
                });
                return obj;
            });
        }

        // โหลดข้อมูลทันทีเมื่อโหลดหน้าเว็บ
        loadRoomData();

        // ดึงข้อมูลใหม่ทุกๆ 30 วินาทีเพื่อความเรียลไทม์
        setInterval(loadRoomData, 30000);
    </script>
</body>
</html>
